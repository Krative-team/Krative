*{box-sizing:border-box;margin:0;padding:0} body{overflow-x:hidden;font-family:Inter,sans-serif}
#loading{padding:80px 20px;text-align:center;color:#777;line-height:1.6}
.theme-btn{position:fixed;bottom:20px;right:20px;z-index:9999;width:38px;height:38px;border-radius:100px;border:1px solid var(--border,#222);background:var(--card,#111);color:var(--text,#fff);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.burger{display:none;cursor:pointer;font-size:22px}
@media(max-width:700px){ .burger{display:block} .nav-links{position:fixed;inset:0 0 0 40%;background:var(--nav);border-left:1px solid var(--border);padding:80px 24px;display:none!important;flex-direction:column;gap:12px;z-index:20} .nav-links.open{display:flex!important} .nav-links a{font-size:16px!important;padding:14px 18px!important} }
.contact-form{display:grid;gap:12px;max-width:480px;margin:0 auto;margin-top:18px}
.contact-form input,.contact-form textarea{background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:12px;font-size:13px;width:100%}
.btn-send{background:var(--accent,#8A6BB5);color:#fff;border:none;padding:12px 18px;border-radius:100px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.skill{display:inline-flex;padding:5px 10px;border-radius:100px;border:1px solid var(--border);font-size:10px;color:var(--sub);margin:3px}
.proj-card{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--card);text-align:left;transition:.2s}
.proj-card:hover{transform:translateY(-3px);border-color:var(--accent,#8A6BB5)}
.proj-card img{width:100%;height:180px;object-fit:cover;display:block}
.proj-card .proj-body{padding:16px}
.social-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.social-row a{width:36px;height:36px;border-radius:100px;display:grid;place-items:center;border:1px solid var(--border);background:var(--card);color:var(--sub);text-decoration:none;font-size:16px;transition:.2s}
.social-row a:hover{background:var(--text);color:var(--bg);border-color:var(--text);transform:translateY(-2px)}
html,body{height:100%} body{min-height:100vh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;min-height:100vh} .content{flex:1} footer{margin-top:auto!important}
.chart-h-bar{margin-bottom:10px} .chart-h-head{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
.chart-h-track{height:8px;background:var(--border);border-radius:10px;overflow:hidden} .chart-h-fill{height:100%;border-radius:10px}
.chart-v-wrap{display:flex;align-items:end;gap:10px;height:160px;margin-top:10px} .chart-v-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.chart-v-bar{width:100%;border-radius:8px 8px 0 0;display:grid;place-items:start center;color:#fff;font-size:9px;font-weight:700;padding-top:4px} .chart-v-label{font-size:9px;color:var(--sub);text-align:center}
.pie{width:140px;height:140px;border-radius:50%;margin:0 auto} .pie-legend{display:grid;gap:6px;margin-top:12px} .pie-legend-item{display:flex;align-items:center;gap:8px;font-size:11px} .dot{width:10px;height:10px;border-radius:50%}
.btn-skills{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:100px;font-size:11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;margin-top:12px}
.btn-skills-nav{background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:100px;font-size:11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.avail{ display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:6px 12px;border-radius:100px;border:1px solid var(--border);background:var(--card);margin-top:10px }
.avail-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
#skillsModal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:9999;display:none;place-items:center;padding:20px} #skillsModal.open{display:grid}
.modal-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;max-width:500px;width:100%;max-height:80vh;overflow:auto}
.proj-grid-2{display:grid;gap:16px;margin-top:18px;grid-template-columns:repeat(2,1fr)} @media(max-width:700px){.proj-grid-2{grid-template-columns:1fr}}
.proj-grid-3{display:grid;gap:16px;margin-top:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.photo-frame{overflow:hidden;display:grid;place-items:center;flex-shrink:0}
.photo-frame img{width:100%;height:100%;object-fit:cover;display:block}
</style>

function applyTheme(t){ if(t==='light'){document.body.classList.add('light'); themeBtnEl.innerHTML='<i class="ri-sun-line"></i>';} else {document.body.classList.remove('light'); themeBtnEl.innerHTML='<i class="ri-moon-line"></i>';} localStorage.setItem('krative_theme',t); }

function getParams(){const u=new URLSearchParams(location.search);return{user:u.get('user'),page:u.get('page')||'home'}} 
let currentPage='home';
function goPage(p){currentPage=p; const {user}=getParams(); history.pushState({},'',`portfolio.html?user=${user}&page=${p}`); renderActive(); closeBurger();}
function renderActive(){ document.querySelectorAll('[data-page]').forEach(el=>{ if(el.tagName==='FOOTER') return; el.style.display=el.getAttribute('data-page')===currentPage?'block':'none'; }); document.querySelectorAll('.nav-link').forEach(a=>a.classList.remove('active')); document.querySelectorAll(`.nav-link[data-nav="${currentPage}"]`).forEach(a=>a.classList.add('active')); window.scrollTo(0,0); }
function toggleBurger(id){ document.getElementById(id)?.classList.toggle('open'); }

function avatarHTML(d,size,radius,extra){ 
  const safeExtra = extra||'';
  if(d.photo) return `<div class="photo-frame" style="width:${size};height:${size};border-radius:${radius};${safeExtra}"><img src="${d.photo}" alt="${d.name}"></div>`; 
  return `<div style="width:${size};height:${size};border-radius:${radius};display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--accent,#8A6BB5),#ff7a7a);color:#fff;${safeExtra}">${(d.name||'A')[0].toUpperCase()}</div>`; 
}
function footerHTML(d,bg,border,sub){ return `<footer style="text-align:center;padding:22px 24px;border-top:1px solid ${border};background:${bg};margin-top:auto"><div style="max-width:1100px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:6px"><p style="font-size:11px;color:${sub}">© ${new Date().getFullYear()} ${d.name} • Built with <a href="index.html" style="color:var(--accent,#8A6BB5);text-decoration:none"><b>Krative</b></a></p><p style="font-size:11px;color:${sub}">${d.views||0} views • ${d.template||''}</p></div></footer>`; }
function skillsHTML(d){ const skills = d.skills && d.skills.length ? d.skills : (d.headline ? [d.headline] : []); return skills.map(s=>`<span class="skill">${s}</span>`).join(''); }
function availabilityHTML(d){
  const av = d.availability || d.available || d.status || d.role || 'Available for new projects';
  const dotColor = av.toLowerCase().includes('not') || av.toLowerCase().includes('busy') ? '#ef4444' : '#22c55e';
  return `<div class="avail"><span class="avail-dot" style="background:${dotColor}"></span>${av}</div>`;
}
function bioHTML(d){ return `<p style="color:var(--sub);margin-top:10px;font-size:13px;line-height:1.6">${d.bio || 'No bio added yet.'}</p>`; }
function techSkillsArray(d){ return d.technical_skills || d.technicalSkills || d.skills_technical || []; }
function softSkillsArray(d){ return d.soft_skills || d.softSkills || []; }
function getChartColors(accent){ return { low: '#9ca3af', mid: '#6b7280', high: accent || '#8A6BB5' }; }
function getChartType(key){
  key=(key||'').toLowerCase();
  if(key.includes('kra-pro')||key.includes('formal executive')||key.includes('neo brutal')||key.includes('swiss')) return 'vertical';
  if(key.includes('bold')||key.includes('gradient')||key.includes('color pop')||key.includes('folio')) return 'pie';
  return 'horizontal';
}
function technicalChartHTML(d, type='horizontal', accent){
  const tech = techSkillsArray(d);
  if(!tech.length) return `<p style="font-size:11px;color:var(--sub)">No technical skills yet</p>`;
  const colors = getChartColors(accent);
  function col(l){ if(l<50) return colors.low; if(l<75) return colors.mid; return colors.high; }
  if(type==='vertical'){
    const max = Math.max(...tech.map(t=>t.level),100);
    return `<div class="chart-v-wrap">${tech.map(t=>{ const h=(t.level/max)*120; return `<div class="chart-v-col"><div class="chart-v-bar" style="height:${h}px;background:${col(t.level)}">${t.level}%</div><span class="chart-v-label">${t.name}</span></div>`; }).join('')}</div>`;
  }
  if(type==='pie'){
    const total = tech.reduce((a,b)=>a+b.level,0) || 1; let acc=0;
    const stops = tech.map(t=>{ const c=col(t.level); const start=(acc/total)*100; acc+=t.level; const end=(acc/total)*100; return `${c} ${start}% ${end}%`; }).join(', ');
    const legend = tech.map(t=>`<div class="pie-legend-item"><span class="dot" style="background:${col(t.level)}"></span>${t.name} — ${t.level}%</div>`).join('');
    return `<div style="text-align:center"><div class="pie" style="background:conic-gradient(${stops})"></div><div class="pie-legend">${legend}</div></div>`;
  }
  return tech.map(t=>{ return `<div class="chart-h-bar"><div class="chart-h-head"><span>${t.name}</span><span style="color:${col(t.level)}">${t.level}%</span></div><div class="chart-h-track"><div class="chart-h-fill" style="width:${t.level}%;background:${col(t.level)}"></div></div></div>`; }).join('');
}
function skillsButtonHTML(d){ return `<button class="btn-skills" onclick="openSkills()"><i class="ri-stack-line"></i> View Skills (${techSkillsArray(d).length + softSkillsArray(d).length})</button>`; }
function skillsNavButton(){ return `<button class="btn-skills-nav" onclick="openSkills()"><i class="ri-stack-line"></i> Skills</button>`; }
function openSkills(){
  const modal=document.getElementById('skillsModal'); const data=window.__portfolioData; if(!data) return;
  const key=(data.template||'minimal dark').toLowerCase();
  const chartType=getChartType(key);
  document.getElementById('modalContent').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h3>Skills</h3><button onclick="closeSkills()" style="background:var(--border);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer"><i class="ri-close-line"></i></button></div><h4 style="margin-top:16px;font-size:12px;color:var(--sub)">Technical Skills</h4><div style="margin-top:10px">${technicalChartHTML(data,chartType, window.__accent || '#8A6BB5')}</div><h4 style="margin-top:18px;font-size:12px;color:var(--sub)">Soft Skills</h4><div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">${softSkillsArray(data).length?softSkillsArray(data).map(s=>`<span class="skill" style="background:var(--bg)">${s}</span>`).join(''):'<span style="font-size:11px;color:var(--sub)">None</span>'}</div>`;
  modal.classList.add('open');
}
function closeSkills(){ document.getElementById('skillsModal').classList.remove('open'); }
function socialsHTML(d, alignClass='left'){
  const links=[]; if(d.github) links.push(`<a href="${d.github}" target="_blank"><i class="ri-github-line"></i></a>`); if(d.linkedin) links.push(`<a href="${d.linkedin}" target="_blank"><i class="ri-linkedin-line"></i></a>`); if(d.twitter||d.x) links.push(`<a href="${d.twitter||d.x}" target="_blank"><i class="ri-twitter-x-line"></i></a>`); if(d.instagram||d.insta) links.push(`<a href="${d.instagram||d.insta}" target="_blank"><i class="ri-instagram-line"></i></a>`); if(d.facebook) links.push(`<a href="${d.facebook}" target="_blank"><i class="ri-facebook-line"></i></a>`); if(d.tiktok) links.push(`<a href="${d.tiktok}" target="_blank"><i class="ri-tiktok-line"></i></a>`); if(d.telegram) links.push(`<a href="${d.telegram}" target="_blank"><i class="ri-telegram-line"></i></a>`); if(d.whatsapp) links.push(`<a href="${d.whatsapp}" target="_blank"><i class="ri-whatsapp-line"></i></a>`); 
  if(links.length===0) return ``;
  return `<div class="social-row ${alignClass}">${links.join('')}</div>`;
}
function contactPageHTML(d){ return `<div data-page="contact"><div style="display:flex;gap:16px;align-items:center;margin-bottom:18px;justify-content:center">${avatarHTML(d,'54px','14px')}<div style="text-align:left"><h2>Contact ${d.name?.split(' ')[0]||''}</h2><p style="font-size:12px;color:var(--sub)">${d.email||''} • ${d.phone||''}</p>${availabilityHTML(d)}</div></div><form class="contact-form" onsubmit="sendInquiry(event,'${d.slug}','${d.email||''}')"><input id="inqName" placeholder="Your Name *" required/><input id="inqContact" placeholder="Your Email or Phone *" required/><textarea id="inqDesc" placeholder="Message *" required></textarea><button class="btn-send" type="submit"><i class="ri-send-plane-line"></i> Send Message</button><p id="inqStatus" style="font-size:12px;color:var(--sub);text-align:center"></p></form></div>`; }
function projectsHTML(d, twoCol=false){
  const gridClass = twoCol ? 'proj-grid-2' : 'proj-grid-3';
  const list=(d.projects||[]).map(p=>`<div class="proj-card">${p.image ? `<img src="${p.image}" alt="${p.title}" loading="lazy">` : `<div style="width:100%;height:180px;background:linear-gradient(135deg,var(--accent,#8A6BB5)22,#ff7a7a22);display:grid;place-items:center;color:var(--sub)"><i class="ri-image-line" style="font-size:28px"></i></div>`}<div class="proj-body"><h4>${p.title||'Untitled'}</h4><p style="color:var(--sub);font-size:12px;margin-top:6px">${p.desc||''}</p>${p.link?`<a href="${p.link}" target="_blank" style="color:var(--accent,#8A6BB5);font-size:12px;margin-top:10px;display:inline-flex;gap:4px">View <i class="ri-external-link-line"></i></a>`:''}</div></div>`).join(''); 
  return `<div data-page="projects"><div style="display:flex;gap:12px;align-items:center;justify-content:center">${avatarHTML(d,'40px','10px')}<h2>Projects by ${d.name?.split(' ')[0]||''}</h2></div><div class="${gridClass}">${list||'<p style="color:var(--sub);text-align:center">No projects</p>'}</div></div>`;
}
function eduHTML(d){ const edu=(d.educations||[]).map(e=>`<div style="border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--card);text-align:left"><b>${e.school||''}</b><p style="font-size:11px;color:var(--sub)">${e.degree||''} • ${e.year||''}</p></div>`).join(''); const works=(d.works||[]).map(w=>`<div style="border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--card);text-align:left"><b>${w.company||''}</b><p style="font-size:11px;color:var(--sub)">${w.role||''}</p><p style="font-size:12px;margin-top:4px">${w.desc||''}</p></div>`).join(''); return `<div data-page="education"><div style="display:flex;gap:12px;align-items:center;justify-content:center">${avatarHTML(d,'40px','10px')}<h2>Journey</h2></div><div style="max-width:600px;margin:10px auto;text-align:center">${availabilityHTML(d)}</div><h4 style="margin-top:20px;text-align:center">Education</h4><div style="display:grid;gap:10px;margin-top:10px;max-width:600px;margin:auto">${edu||'<p style="color:var(--sub);font-size:12px;text-align:center">No education</p>'}</div><h4 style="margin-top:20px;text-align:center">Work</h4><div style="display:grid;gap:10px;margin-top:10px;max-width:600px;margin:auto">${works||'<p style="color:var(--sub);font-size:12px;text-align:center">No work</p>'}</div></div>`; }
async function sendInquiry(e,slug,ownerEmail){ e.preventDefault(); const name=inqName.value, contact=inqContact.value, desc=inqDesc.value; inqStatus.innerText='Sending...'; try{ if(supabaseClient) await supabaseClient.from('inquiries').insert({portfolio_slug:slug,owner_email:ownerEmail,sender_name:name,sender_contact:contact,message:desc}); inqStatus.innerHTML='<span style="color:#4ade80">Sent!</span>'; e.target.reset(); }catch(err){ inqStatus.innerText='Saved locally'; } }

const ALIASES={'neo brutal':'formal executive','formal executive':'formal executive','formal ledger':'terminal','executive':'formal executive','ledger':'terminal','minimal':'minimal dark','kra-pro':'kra-pro dark'};

async function fetchPortfolioBySlug(slug){
  if(supabaseClient){
    try{
      const {data,error}=await supabaseClient.from('portfolios').select('*').eq('slug',slug).single();
      if(!error && data) return data;
    }catch(e){}
  }
  const res=await fetch(`${SUPABASE_URL}/rest/v1/portfolios?slug=eq.${encodeURIComponent(slug)}&select=*`,{
    headers:{apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`}
  });
  const arr=await res.json();
  if(Array.isArray(arr) && arr.length) return arr[0];
  throw new Error('Portfolio not found: '+slug);
}

async function load(){
  const {user,page}=getParams(); 
  if(!user){ document.getElementById('loading').innerHTML=`No user slug. <a href="index.html" style="color:#8A6BB5">Go Home</a>`; return; }
  currentPage=page||'home';
  document.getElementById('loadDetail').innerText='Fetching: '+user;
  try{
    const data=await fetchPortfolioBySlug(user);
    window.__portfolioData=data;
    window.__accent=(TEMPLATES[(data.template||'minimal dark').toLowerCase()]||TEMPLATES['minimal dark'])(data).accent || '#8A6BB5';
    try{ if(supabaseClient) await supabaseClient.from('portfolios').update({views:(data.views||0)+1}).eq('slug',user); data.views=(data.views||0)+1; }catch(_){}
    let key=(data.template||'minimal dark').toLowerCase().trim(); key=ALIASES[key]||key;
    const tpl=TEMPLATES[key]||TEMPLATES['minimal dark']; const rendered=tpl(data);
    window.__accent=rendered.accent;
    document.getElementById('tplStyle').innerHTML=rendered.css; 
    document.getElementById('app').innerHTML=rendered.html;
    document.getElementById('loading').style.display='none'; 
    document.getElementById('app').style.display='block'; 
    renderActive();
  }catch(e){
    document.getElementById('loading').innerHTML=`<div style="padding:20px"><h3 style="color:#ff5a5a">Could not load portfolio</h3><p>${e.message}</p><a href="index.html" style="display:inline-block;margin-top:16px;background:#8A6BB5;color:#fff;padding:10px 18px;border-radius:20px;text-decoration:none">Go Home</a></div>`;
  }
}
load(); window.onpopstate=()=>{currentPage=getParams().page||'home'; renderActive();}
