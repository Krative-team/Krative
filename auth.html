<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Create Account - Krative Portfolio Builder</title>
<meta name="description" content="Create your Krative portfolio account. Official site krative-team.github.io/Krative/">
<link rel="canonical" href="https://krative-team.github.io/Krative/auth.html">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}
body{background:#0A0A0A;color:#fff;min-height:100vh}
.auth-wrap{max-width:440px;margin:0 auto;padding:24px 20px}
.logo{font-size:26px;font-weight:800;text-align:center;margin:16px 0} .logo span{color:#8A6BB5}
.card{background:#111;border:1px solid #222;border-radius:18px;padding:22px;margin-top:16px}
label{font-size:10px;color:#777;text-transform:uppercase;margin:14px 0 6px;display:block}
input{width:100%;background:#0A0A0A;border:1px solid #222;color:#fff;padding:12px 14px;border-radius:12px;outline:none}
.btn{width:100%;padding:13px;border-radius:100px;border:none;font-weight:800;cursor:pointer;margin-top:16px;background:#8A6BB5;color:#fff}
.msg{font-size:13px;margin-top:12px;padding:10px;border-radius:10px;display:none}
.err{background:#1a1111;color:#ff7a7a} .ok{background:#0f1a14;color:#4ade80}
</style>
</head>
<body>
<div class="auth-wrap">
<div class="logo">Krative<span>.</span></div>
<p style="text-align:center;font-size:12px;color:#777;margin-bottom:20px">Official Krative account • This is NOT a Google or Gmail login</p>

<div class="card">
<h3>Create Your Krative Portfolio</h3>
<p style="font-size:11px;color:#777;margin-top:6px">This account is only for krative-team.github.io/Krative/ portfolio. We never ask for your Google password or bank info.</p>

<label>Full Name *</label>
<input id="rName" autocomplete="off" placeholder="Samuel Adeyemi"/>

<label>Username *</label>
<input id="rUsername" autocomplete="off" placeholder="sam01"/>

<label>Email for portfolio *</label>
<input id="rEmail" type="email" autocomplete="off" placeholder="samuel@gmail.com"/>

<label>Access Code *</label>
<input id="rPass" type="text" autocomplete="new-password" placeholder="Create a 6+ character code for Krative only"/>

<button class="btn" onclick="doRegister()">Create Account</button>
<div id="regErr" class="msg err"></div><div id="regOk" class="msg ok"></div>
<p style="text-align:center;margin-top:18px;font-size:12px;color:#666">Contact: etoabasis@gmail.com • Official: krative-team.github.io/Krative/</p>
</div>
</div>

<script>
const SUPABASE_URL='https://pfrpgijjqajwuhyfcdgw.supabase.co';
const SUPABASE_KEY='YOUR_ANON_KEY';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function doRegister(){
 const name=document.getElementById('rName').value.trim();
 const user=document.getElementById('rUsername').value.trim();
 const email=document.getElementById('rEmail').value.trim();
 const code=document.getElementById('rPass').value;
 if(!name||!user||!email||!code){document.getElementById('regErr').innerText='Fill all fields';document.getElementById('regErr').style.display='block';return;}
 document.getElementById('regOk').innerText='Account created for '+user+'! Go to dashboard.';
 document.getElementById('regOk').style.display='block';
}
</script>
</body>
</html>
