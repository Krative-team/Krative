<style>
*{box-sizing:border-box;margin:0;padding:0} body{overflow-x:hidden;font-family:Inter,sans-serif}
#loading{padding:80px 20px;text-align:center;color:#777}
.theme-btn{position:fixed;bottom:20px;right:20px;z-index:9999;width:38px;height:38px;border-radius:100px;border:1px solid var(--border,#222);background:var(--card,#111);color:var(--text,#fff);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.burger{display:none;cursor:pointer;font-size:22px}
@media(max-width:700px){ .burger{display:block} .nav-links{position:fixed;inset:0 0 0 40%;background:var(--nav);border-left:1px solid var(--border);padding:80px 24px;display:none!important;flex-direction:column;gap:12px;z-index:20} .nav-links.open{display:flex!important} .nav-links a{font-size:16px!important;padding:14px 18px!important} }
.contact-form{display:grid;gap:12px;max-width:480px;margin:0 auto;margin-top:18px}
.contact-form input,.contact-form textarea{background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:12px;font-size:13px;width:100%}
.btn-send{background:#8A6BB5;color:#fff;border:none;padding:12px 18px;border-radius:100px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.skill{display:inline-flex;padding:5px 10px;border-radius:100px;border:1px solid var(--border);font-size:10px;color:var(--sub);margin:3px}
.proj-card{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--card);text-align:left;transition:.2s}
.proj-card:hover{transform:translateY(-3px);border-color:#8A6BB5}
.proj-card img{width:100%;height:180px;object-fit:cover;display:block}
.proj-card .proj-body{padding:16px}
.social-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.social-row a{width:36px;height:36px;border-radius:100px;display:grid;place-items:center;border:1px solid var(--border);background:var(--card);color:var(--sub);text-decoration:none;font-size:16px;transition:.2s}
.social-row a:hover{background:var(--text);color:var(--bg);border-color:var(--text);transform:translateY(-2px)}
.social-row.center{justify-content:center}
.social-row.left{justify-content:flex-start}
html,body{height:100%}
body{min-height:100vh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;min-height:calc(100vh - 40px)}
.content{flex:1}
footer{margin-top:auto!important}
</style>
<style id="tplStyle"></style>
</head><body>

const themeBtnEl=document.getElementById('themeBtn');
function applyTheme(t){ if(t==='light'){document.body.classList.add('light'); themeBtnEl.innerHTML='<i class="ri-sun-line"></i>';} else {document.body.classList.remove('light'); themeBtnEl.innerHTML='<i class="ri-moon-line"></i>';} localStorage.setItem('krative_theme',t); }
applyTheme(localStorage.getItem('krative_theme')||'dark');

function getParams(){const u=new URLSearchParams(location.search);return{user:u.get('user'),page:u.get('page')||'home'}} let currentPage='home';
function goPage(p){currentPage=p; const {user}=getParams(); history.pushState({},'',`portfolio.html?user=${user}&page=${p}`); renderActive(); closeBurger();}
function renderActive(){ document.querySelectorAll('[data-page]').forEach(el=>{ if(el.tagName==='FOOTER') return; el.style.display=el.getAttribute('data-page')===currentPage?'block':'none'; }); document.querySelectorAll('.nav-link').forEach(a=>a.classList.remove('active')); document.querySelectorAll(`.nav-link[data-nav="${currentPage}"]`).forEach(a=>a.classList.add('active')); window.scrollTo(0,0); }
function toggleBurger(id){ document.getElementById(id)?.classList.toggle('open'); }
function closeBurger(){ document.querySelectorAll('.nav-links').forEach(el=>el.classList.remove('open')); }
function avatarHTML(d,size,radius,extra){ if(d.photo) return `<img src="${d.photo}" style="width:${size};height:${size};border-radius:${radius};object-fit:cover;${extra||''}">`; return `<div style="width:${size};height:${size};border-radius:${radius};display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#8A6BB5,#ff7a7a);color:#fff;${extra||''}">${(d.name||'A')[0].toUpperCase()}</div>`; }
function footerHTML(d,bg,border,sub){ return `<footer style="text-align:center;padding:22px 24px;border-top:1px solid ${border};background:${bg}"><div style="max-width:1100px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px"><p style="font-size:11px;color:${sub};text-align:center">© ${new Date().getFullYear()} ${d.name} • Built with <a href="index.html" style="font-size:12px;color:#8A6BB5;text-decoration:none"><b>Krative</b></a></p><p style="font-size:11px;color:${sub};text-align:center">${d.views||0} views • ${d.template||''}</p></div></footer>`; }
function skillsHTML(d){ 
  const skills = d.skills && d.skills.length ? d.skills : (d.headline ? [d.headline] : []);
  return skills.map(s=>`<span class="skill">${s}</span>`).join(''); 
}

function socialsHTML(d, alignClass='left'){
  const links=[];
  const gh = d.github || d.github_url;
  const li = d.linkedin || d.linkedin_url;
  const tw = d.twitter || d.x || d.twitter_url;
  const ig = d.instagram || d.insta;
  const fb = d.facebook || d.fb;
  const tk = d.tiktok;
  const tg = d.telegram;
  const wa = d.whatsapp;
  const web = d.website;
  const yt = d.youtube;
  if(gh) links.push(`<a href="${gh}" target="_blank"><i class="ri-github-line"></i></a>`);
  if(li) links.push(`<a href="${li}" target="_blank"><i class="ri-linkedin-line"></i></a>`);
  if(tw) links.push(`<a href="${tw}" target="_blank"><i class="ri-twitter-x-line"></i></a>`);
  if(ig) links.push(`<a href="${ig}" target="_blank"><i class="ri-instagram-line"></i></a>`);
  if(fb) links.push(`<a href="${fb}" target="_blank"><i class="ri-facebook-line"></i></a>`);
  if(tk) links.push(`<a href="${tk}" target="_blank"><i class="ri-tiktok-line"></i></a>`);
  if(tg) links.push(`<a href="${tg}" target="_blank"><i class="ri-telegram-line"></i></a>`);
  if(wa) links.push(`<a href="${wa}" target="_blank"><i class="ri-whatsapp-line"></i></a>`);
  if(web) links.push(`<a href="${web}" target="_blank"><i class="ri-global-line"></i></a>`);
  if(yt) links.push(`<a href="${yt}" target="_blank"><i class="ri-youtube-line"></i></a>`);
  if(links.length===0) return `<div class="social-row ${alignClass}" style="opacity:.5;font-size:11px;color:var(--sub)">No socials added</div>`;
  return `<div class="social-row ${alignClass}">${links.join('')}</div>`;
}

function contactPageHTML(d){ return `<div data-page="contact"><div style="display:flex;gap:16px;align-items:center;margin-bottom:18px;justify-content:center">${avatarHTML(d,'54px','14px')}<div style="text-align:left"><h2>Contact ${d.name?.split(' ')[0]||''}</h2><p style="font-size:12px;color:var(--sub)">${d.email||''} • ${d.phone||''}</p></div></div><form class="contact-form" onsubmit="sendInquiry(event,'${d.slug}','${d.email||''}')"><input id="inqName" placeholder="Your Name *" required/><input id="inqContact" placeholder="Your Email or Phone *" required/><textarea id="inqDesc" placeholder="Message *" required></textarea><button class="btn-send" type="submit"><i class="ri-send-plane-line"></i> Send Message</button><p id="inqStatus" style="font-size:12px;color:var(--sub);text-align:center"></p></form></div>`; }
function projectsHTML(d){ 
  const list=(d.projects||[]).map(p=>`
  <div class="proj-card">
    ${p.image ? `<img src="${p.image}" alt="${p.title||'project'}" loading="lazy">` : `<div style="width:100%;height:120px;background:linear-gradient(135deg,#8A6BB522,#ff7a7a22);display:grid;place-items:center;color:var(--sub)"><i class="ri-image-line" style="font-size:28px"></i></div>`}
    <div class="proj-body">
      <h4>${p.title||'Untitled Project'}</h4>
      <p style="color:var(--sub);font-size:12px;margin-top:6px;line-height:1.5">${p.desc||''}</p>
      ${p.link?`<a href="${p.link}" target="_blank" style="color:#8A6BB5;font-size:12px;margin-top:10px;display:inline-flex;gap:4px;align-items:center">View Project <i class="ri-external-link-line"></i></a>`:''}
    </div>
  </div>`).join(''); 
  return `<div data-page="projects"><div style="display:flex;gap:12px;align-items:center;justify-content:center">${avatarHTML(d,'40px','10px')}<h2>Projects by ${d.name?.split(' ')[0]||''}</h2></div><div style="display:grid;gap:16px;margin-top:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${list||'<p style="color:var(--sub);text-align:center">No projects added yet</p>'}</div></div>`; 
}
function eduHTML(d){ const edu=(d.educations||[]).map(e=>`<div style="border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--card);text-align:left"><b>${e.school||''}</b><p style="font-size:11px;color:var(--sub)">${e.degree||''} • ${e.year||''}</p><p style="font-size:12px;margin-top:4px">${e.desc||''}</p></div>`).join(''); const works=(d.works||[]).map(w=>`<div style="border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--card);text-align:left"><b>${w.company||w.title||''}</b><p style="font-size:11px;color:var(--sub)">${w.role||''} • ${w.duration||''}</p><p style="font-size:12px;margin-top:4px">${w.desc||''}</p></div>`).join(''); return `<div data-page="education"><div style="display:flex;gap:12px;align-items:center;justify-content:center">${avatarHTML(d,'40px','10px')}<h2>Journey</h2></div><h4 style="margin-top:20px;text-align:center">Education</h4><div style="display:grid;gap:10px;margin-top:10px;max-width:600px;margin-left:auto;margin-right:auto">${edu||'<p style="color:var(--sub);font-size:12px;text-align:center">No education added</p>'}</div><h4 style="margin-top:20px;text-align:center">Work</h4><div style="display:grid;gap:10px;margin-top:10px;max-width:600px;margin-left:auto;margin-right:auto">${works||'<p style="color:var(--sub);font-size:12px;text-align:center">No work added</p>'}</div></div>`; }
async function sendInquiry(e,slug,ownerEmail){ e.preventDefault(); const name=inqName.value, contact=inqContact.value, desc=inqDesc.value; inqStatus.innerText='Sending...'; try{ await supabaseClient.from('inquiries').insert({portfolio_slug:slug,owner_email:ownerEmail,sender_name:name,sender_contact:contact,message:desc}); inqStatus.innerHTML='<span style="color:#4ade80">Sent!</span>'; e.target.reset(); }catch(err){ inqStatus.innerText='Message saved locally'; } }

// ALIASES - THIS FIXES BLANK PAGE
const TEMPLATE_ALIASES = {
  'formal executive':'neo brutal',
  'formal ledger':'terminal',
  'executive':'neo brutal',
  'ledger':'terminal',
  'minimal':'minimal dark',
  'kra-pro':'kra-pro dark'
};

async function load(){
  const {user,page}=getParams();
  if(!user){loading.innerHTML='User not found in URL. Example: portfolio.html?user=samuel123';return;}
  currentPage=page||'home';
  try{
    const {data,error}=await supabaseClient.from('portfolios').select('*').eq('slug',user).single();
    if(error) throw error;
    if(!data){ throw new Error('Portfolio not found'); }
    try{ await supabaseClient.from('portfolios').update({views:(data.views||0)+1}).eq('slug',user); data.views++; }catch(_){}
    let key=(data.template||'minimal dark').toLowerCase().trim();
    key = TEMPLATE_ALIASES[key] || key;
    const tpl=TEMPLATES[key]||TEMPLATES['minimal dark'];
    const rendered=tpl(data);
    document.getElementById('tplStyle').innerHTML=rendered.css;
    document.getElementById('app').innerHTML=rendered.html;
    loading.style.display='none';
    app.style.display='block';
    renderActive();
  }catch(e){
    loading.innerHTML=`<div style="padding:20px"><p>Not found: ${e.message}</p><p style="font-size:11px;color:#777;margin-top:8px">User: ${user}</p><a href="index.html" style="color:#8A6BB5">Go Home</a></div>`;
    console.error(e);
  }
}
load();
window.onpopstate=()=>{currentPage=getParams().page||'home'; renderActive();}
</script></body></html>
